---
kind: pipeline
type: docker
name: deploy

platform:
  os: linux
  arch: amd64

depends_on:
  - quality

concurrency:
  limit: 1

steps:
  # 1. 將 deploy branch 指向這次通過 CI 的 commit
  - name: promote-deploy-ref
    image: alpine/git:latest
    environment:
      GITEA_DEPLOY_USER:
        from_secret: gitea_deploy_user
      GITEA_DEPLOY_TOKEN:
        from_secret: gitea_deploy_token
    commands:
      - |
        cat >/tmp/git-askpass.sh <<'EOF'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' "$GITEA_DEPLOY_USER" ;;
          *Password*) printf '%s\n' "$GITEA_DEPLOY_TOKEN" ;;
        esac
        EOF

      - chmod 700 /tmp/git-askpass.sh
      - export GIT_ASKPASS=/tmp/git-askpass.sh
      - export GIT_TERMINAL_PROMPT=0

      - git push origin "${DRONE_COMMIT_SHA}:refs/heads/deploy"

  # 2. 要 Portainer pull deploy branch + Docker build + redeploy
  - name: portainer-redeploy
    image: curlimages/curl:latest
    depends_on:
      - promote-deploy-ref
    environment:
      PORTAINER_URL:
        from_secret: portainer_url
      PORTAINER_API_TOKEN:
        from_secret: portainer_api_token
      PORTAINER_STACK_ID:
        from_secret: portainer_stack_id
      PORTAINER_ENDPOINT_ID:
        from_secret: portainer_endpoint_id
    commands:
      - |
        curl -kfsS \
          -X PUT \
          -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
          -H "Content-Type: application/json" \
          "${PORTAINER_URL}/api/stacks/${PORTAINER_STACK_ID}/git/redeploy?endpointId=${PORTAINER_ENDPOINT_ID}" \
          -d '{"Prune":false}'

  # 3. 確認新版真的活著
  - name: verify-deployment
    image: curlimages/curl:latest
    depends_on:
      - portainer-redeploy
    commands:
      - |
        for i in $(seq 1 30); do
          if curl -fsS \
            http://192.168.16.17:3100/health; then
            echo
            echo "Deployment healthy."
            exit 0
          fi

          echo "Waiting for release-controller... ($i/30)"
          sleep 2
        done

        echo "Deployment health check failed."
        exit 1

  # 4. 部署成功後才建立版本 tag
  - name: tag-release
    image: alpine/git:latest
    depends_on:
      - verify-deployment
    environment:
      GITEA_DEPLOY_USER:
        from_secret: gitea_deploy_user
      GITEA_DEPLOY_TOKEN:
        from_secret: gitea_deploy_token
    commands:
      - |
        VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
        test -n "$VERSION"

        RELEASE_TAG="v${VERSION}"

        cat >/tmp/git-askpass.sh <<'EOF'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' "$GITEA_DEPLOY_USER" ;;
          *Password*) printf '%s\n' "$GITEA_DEPLOY_TOKEN" ;;
        esac
        EOF

        chmod 700 /tmp/git-askpass.sh
        export GIT_ASKPASS=/tmp/git-askpass.sh
        export GIT_TERMINAL_PROMPT=0

        git fetch --tags origin

        EXISTING_TAG_COMMIT="$(
          git rev-parse -q --verify \
            "refs/tags/${RELEASE_TAG}^{commit}" || true
        )"

        if [ -n "$EXISTING_TAG_COMMIT" ] &&
           [ "$EXISTING_TAG_COMMIT" != "$DRONE_COMMIT_SHA" ]; then
          echo \
            "Tag ${RELEASE_TAG} already belongs to another commit. Bump version first." \
            >&2
          exit 1
        fi

        if [ -z "$EXISTING_TAG_COMMIT" ]; then
          git tag "$RELEASE_TAG" "$DRONE_COMMIT_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"
        fi

trigger:
  branch:
    - main
  event:
    - push