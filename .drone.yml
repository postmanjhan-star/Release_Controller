---
kind: pipeline
type: docker
name: fast-quality

platform:
  os: linux
  arch: amd64

clone:
  depth: 1

steps:
  - name: frontend-quality
    image: node:20.20.2-bookworm-slim
    commands:
      - cd frontend
      - npm ci
      - npm run quality

  - name: python-quality
    image: python:3.10-slim-bookworm
    depends_on:
      - frontend-quality
    environment:
      APP_ENV: test
      BACKGROUND_WORKER_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    commands:
      - python -m pip install --no-cache-dir -r requirements-dev.txt
      - python -m ruff check app tests alembic devtools
      - python -m ruff format --check app tests alembic devtools
      # Keep every Python test, including MCP, permissions and recovery.
      - python -m pytest -vv --sqlite-no-sync --basetemp=/tmp/pytest-run --durations=30 -o faulthandler_timeout=120 --junitxml=test-results/pytest.xml

trigger:
  branch:
    exclude:
      - main
      - deploy
  event:
    - push


---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

clone:
  depth: 1

steps:
  # Build app/static in the shared workspace before Python tests serve the UI.
  - name: frontend-quality
    image: node:20.20.2-bookworm-slim
    commands:
      - cd frontend
      - npm ci
      - npm run quality

  - name: python-quality
    image: python:3.10-slim-bookworm
    depends_on:
      - frontend-quality
    environment:
      APP_ENV: test
      BACKGROUND_WORKER_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    commands:
      - python -m pip install --no-cache-dir -r requirements-dev.txt
      - python -m ruff check app tests alembic devtools
      - python -m ruff format --check app tests alembic devtools
      - python -m pytest --cov=app --cov-report=term-missing --cov-report=xml -vv --sqlite-no-sync --basetemp=/tmp/pytest-run --durations=30 -o faulthandler_timeout=120 --junitxml=test-results/pytest.xml

  - name: browser-e2e
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on:
      - python-quality
    environment:
      CI: "true"
    commands:
      - cd frontend
      - npm run test:e2e -- --workers=1

trigger:
  branch:
    - main
  event:
    - push
    - pull_request
    - cron
    - custom


---
kind: pipeline
type: docker
name: deploy

platform:
  os: linux
  arch: amd64

clone:
  depth: 0

depends_on:
  - quality

concurrency:
  limit: 1

steps:
  # ----------------------------------------------------------
  # 1. Validate release version before touching production.
  #
  # Prevent:
  #   v3.0.1 -> commit A
  #   new commit B still says version=3.0.1
  #
  # In that case deployment stops here.
  # ----------------------------------------------------------
  - name: release-preflight
    image: alpine:3.22
    environment:
      GITEA_DEPLOY_USER:
        from_secret: gitea_deploy_user
      GITEA_DEPLOY_TOKEN:
        from_secret: gitea_deploy_token

    commands:
      - apk add --no-cache git

      - |
        cat > .drone-git-askpass.sh <<'EOF'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' "$GITEA_DEPLOY_USER" ;;
          *Password*) printf '%s\n' "$GITEA_DEPLOY_TOKEN" ;;
        esac
        EOF

        chmod 700 .drone-git-askpass.sh

      - |
        export GIT_ASKPASS="$PWD/.drone-git-askpass.sh"
        export GIT_TERMINAL_PROMPT=0

        git fetch --tags origin

        VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"

        if [ -z "$VERSION" ]; then
          echo "Unable to read version from pyproject.toml" >&2
          exit 1
        fi

        RELEASE_TAG="v$VERSION"

        echo "Release version: $RELEASE_TAG"
        echo "Commit: ${DRONE_COMMIT_SHA}"

        EXISTING_TAG_COMMIT="$(
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true
        )"

        if [ -n "$EXISTING_TAG_COMMIT" ] &&
           [ "$EXISTING_TAG_COMMIT" != "${DRONE_COMMIT_SHA}" ]; then

          echo \
            "Tag $RELEASE_TAG already points to another commit." \
            >&2

          echo \
            "Bump the version in pyproject.toml and uv.lock before deploying." \
            >&2

          exit 1
        fi

        printf '%s\n' "$RELEASE_TAG" > .release-tag


  # ----------------------------------------------------------
  # 2. Promote the CI-passed commit to the deploy branch.
  #
  # main   = source/development history
  # deploy = commit currently approved for deployment
  # ----------------------------------------------------------
  - name: promote-deploy-ref
    image: alpine:3.22
    depends_on:
      - release-preflight

    environment:
      GITEA_DEPLOY_USER:
        from_secret: gitea_deploy_user
      GITEA_DEPLOY_TOKEN:
        from_secret: gitea_deploy_token

    commands:
      - apk add --no-cache git

      - |
        export GIT_ASKPASS="$PWD/.drone-git-askpass.sh"
        export GIT_TERMINAL_PROMPT=0

        echo "Promoting ${DRONE_COMMIT_SHA} to deploy branch..."

        git push \
          origin \
          "${DRONE_COMMIT_SHA}:refs/heads/deploy"


  # ----------------------------------------------------------
  # 3. Tell Portainer to pull the deploy branch and redeploy.
  #
  # This replaces:
  #   SSH
  #   deploy-release-controller.sh
  #   podman build
  #   podman rm/run
  # ----------------------------------------------------------
  - name: portainer-redeploy
    image: python:3.10-slim-bookworm
    depends_on:
      - promote-deploy-ref

    environment:
      PORTAINER_URL:
        from_secret: portainer_url
      PORTAINER_API_TOKEN:
        from_secret: portainer_api_token
      PORTAINER_STACK_ID:
        from_secret: portainer_stack_id
      PORTAINER_ENDPOINT_ID:
        from_secret: portainer_endpoint_id

    commands:
      - python -m devtools.portainer_redeploy --insecure


  # ----------------------------------------------------------
  # 4. Verify health AND the version of the frontend actually being served.
  # ----------------------------------------------------------
  - name: verify-deployment
    image: curlimages/curl:latest
    depends_on:
      - portainer-redeploy

    environment:
      DEPLOYMENT_HEALTH_URL:
        from_secret: deployment_health_url

    commands:
      - |
        if [ -z "$${DEPLOYMENT_HEALTH_URL:-}" ]; then
          echo "Set Drone secret deployment_health_url to the application's reachable /health URL." >&2
          exit 1
        fi

        HEALTH_BASE="$${DEPLOYMENT_HEALTH_URL%%\?*}"
        case "$HEALTH_BASE" in
          */health) VERSION_URL="$${HEALTH_BASE%/health}/version.json" ;;
          *) echo "deployment_health_url must end in /health (optional query allowed)." >&2; exit 1 ;;
        esac
        RELEASE_TAG="$(cat .release-tag)"
        VERSION="$${RELEASE_TAG#v}"
        EXPECTED_VERSION="{\"version\":\"$VERSION\"}"

        echo "Waiting for Release Controller $RELEASE_TAG health and frontend version..."

        for i in $(seq 1 45); do

          if curl -fsS \
            --max-time 5 \
            "$DEPLOYMENT_HEALTH_URL" >/dev/null &&
             SERVED_VERSION="$(curl -fsS --max-time 5 \
               -H 'Cache-Control: no-cache' "$VERSION_URL")" &&
             [ "$SERVED_VERSION" = "$EXPECTED_VERSION" ]; then

            echo "Deployment healthy. Frontend version matches $RELEASE_TAG."
            exit 0
          fi

          echo "Waiting for release-controller... ($i/45)"
          sleep 2
        done

        echo
        echo "Deployment health or frontend version check failed; expected $RELEASE_TAG." >&2
        exit 1


  # ----------------------------------------------------------
  # 5. Only tag the source commit AFTER production is healthy.
  #
  # The tag event triggers the release pipeline below.
  # ----------------------------------------------------------
  - name: tag-release
    image: alpine:3.22
    depends_on:
      - verify-deployment

    environment:
      GITEA_DEPLOY_USER:
        from_secret: gitea_deploy_user
      GITEA_DEPLOY_TOKEN:
        from_secret: gitea_deploy_token

    commands:
      - apk add --no-cache git

      - |
        export GIT_ASKPASS="$PWD/.drone-git-askpass.sh"
        export GIT_TERMINAL_PROMPT=0

        RELEASE_TAG="$(cat .release-tag)"

        git fetch --tags origin

        EXISTING_TAG_COMMIT="$(
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true
        )"

        if [ -n "$EXISTING_TAG_COMMIT" ]; then

          if [ "$EXISTING_TAG_COMMIT" = "${DRONE_COMMIT_SHA}" ]; then
            echo "$RELEASE_TAG already exists on this commit."
            echo "Nothing to do."
            exit 0
          fi

          echo \
            "$RELEASE_TAG unexpectedly points to another commit." \
            >&2

          exit 1
        fi

        echo "Creating release tag $RELEASE_TAG"

        git tag "$RELEASE_TAG" "${DRONE_COMMIT_SHA}"

        git push \
          origin \
          "refs/tags/$RELEASE_TAG"


trigger:
  branch:
    - main
  event:
    - push


---
kind: pipeline
type: docker
name: release

platform:
  os: linux
  arch: amd64

clone:
  disable: true

steps:
  - name: publish-gitea-release
    image: plugins/gitea-release:1

    settings:
      api_key:
        from_secret: gitea_release_token

      base_url:
        from_secret: gitea_server

      title: "${DRONE_TAG}"

      note: "Automatically published after a successful production deployment."

      files: []

trigger:
  ref:
    - refs/tags/v*
  event:
    - tag
