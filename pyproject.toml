[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-controller"
version = "3.0.5"
description = "Release workflow controller backed by Drone"
readme = "README.md"
requires-python = ">=3.10"
# Local uv dependencies. Production keeps using requirements.txt in Containerfile.
dependencies = [
    "alembic==1.16.4",
    "cryptography==50.0.1",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "pydantic==2.11.7",
    "python-multipart==0.0.20",
    "spiffworkflow==3.1.2",
    "sqlalchemy==2.0.43",
    "tzdata==2025.2",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
dev = "devtools.cli:dev"
db-current = "devtools.cli:db_current"
db-upgrade = "devtools.cli:db_upgrade"
lint = "devtools.cli:lint"
test = "devtools.cli:test"
quality = "devtools.cli:quality"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["app*", "devtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI intentionally declares Depends/Body calls as defaults.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
