services:
  release-controller:
    build:
      context: .
      dockerfile: Containerfile

    container_name: release-controller
    restart: unless-stopped

    ports:
      - "${HOST_IP:-127.0.0.1}:${HOST_PORT:-3100}:8000"

    volumes:
      - "${DATA_DIR:-./data}:/data"

    env_file:
      - stack.env

    environment:
      # Container deployment固定使用持久化 DB。
      # 覆蓋 .env.example 的 local-development 預設值。
      DATABASE_URL: sqlite:////data/release.db

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s